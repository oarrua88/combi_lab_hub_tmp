name: planet
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # On Windows/macOS PyPI torch is the CPU build. On Linux it pulls CUDA
      # libraries (large); the Dockerfile installs the CPU build instead.
      - torch==2.2.2
      - numpy==1.26.4
      - scipy==1.11.4
      - pandas==2.1.4
      - scikit-learn==1.3.2
      - rdkit==2023.9.5
      - matplotlib==3.8.2
      - tqdm==4.66.1
