name: dlinf9
# Linux only (smina, MSMS and MGLTools are Linux programs). On Windows use Docker or WSL.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.8
  - rdkit=2020.09.5
  - openbabel=3.1.1
  - pandas=1.3.5
  - scipy=1.5.3
  - numpy=1.24.4
  - mdtraj=1.10.0
  - msms=2.6.1
  - pip
  - pip:
      - xgboost==1.2.0     # the saved models are pickled with xgboost 1.2.0
# AlphaSpace2 comes with the repository: see INSTALL.md, step A3.
