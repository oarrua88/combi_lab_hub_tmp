name: deepbindgcn
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.2.3
  - networkx=3.4.2
  - scikit-learn=1.5.2
  - rdkit=2025.03.6
  - pip
  - pip:
      # On Windows the PyPI build of torch is CPU-only.
      - torch==2.2.2
      - torch_geometric==2.5.3
