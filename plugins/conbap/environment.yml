name: conbap
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.15.2
  - scikit-learn=1.5.2
  - networkx=3.4.2
  - matplotlib=3.10.*
  - biopython=1.85
  - rdkit=2025.03.6
  - pymol-open-source=3.1.0   # pocket extraction (authors' preprocessing)
  - tqdm
  - requests
  - pip
  - pip:
      # On Windows the PyPI build of torch is CPU-only.
      # torch_scatter / torch_cluster: CPU wheels built by PyG for torch 2.2.
      - --find-links https://data.pyg.org/whl/torch-2.2.0+cpu.html
      - torch==2.2.2
      - torch_geometric==2.5.3
      - torch_scatter==2.1.2
      - torch_cluster==1.6.3
      # GVP-GNN (drorlab/gvp-pytorch) is installed afterwards with --no-deps
      # (its setup.py pulls atom3d, which is not needed): see INSTALL.md, step A2.
