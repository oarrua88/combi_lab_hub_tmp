name: dtitr
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - pip:
      # Authors: Python 3.9.6 + TensorFlow 2.6.0 (GPU). CombiLabHUB uses the CPU build of
      # the same version; the checkpoint loads unchanged and reproduces the authors'
      # Davis evaluation (MSE 0.192, CI 0.907).
      - tensorflow-cpu==2.6.0
      - keras==2.6.0
      - tensorflow-estimator==2.6.0
      - tensorboard==2.6.0
      - tensorflow-addons==0.14.0
      - typeguard==2.13.3
      - numpy==1.19.5
      - h5py==3.1.0
      - protobuf==3.20.3
      - pandas==1.3.5
      - scipy==1.10.1
      - scikit-learn==0.24.2
      - matplotlib==3.6.3
      - seaborn==0.12.2
      - periodictable==2.0.2
      - subword-nmt==0.3.8
      # Not used by the authors (they start from SMILES); reads the CASF-2016 ligands.
      - rdkit-pypi==2022.9.5
