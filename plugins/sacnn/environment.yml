name: sacnn
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  # mdtraj (needed by moleculekit) has no Windows wheel on PyPI: take it from conda-forge
  - mdtraj=1.10.3
  # Open Babel: moleculekit's atom typer calls it (obabel_cli.py imports openbabel.pybel)
  - openbabel=3.1.1
  - pip
  - pip:
      # On Windows the PyPI build of torch is CPU-only.
      # moleculekit from PyPI (Acellera's conda channel only has old versions);
      # HTMD is NOT needed (see INSTALL.md).
      - torch==2.5.1
      - moleculekit==1.11.5
      - pdb2pqr==3.6.1
      - propka==3.5.1
      - rdkit==2024.3.5
      - numpy==1.26.4
      - scipy==1.15.2
      - pandas==2.2.3
      - networkx==3.4.2
      - h5py==3.16.0
      - biopython==1.88
      - matplotlib==3.10.9
      - msgpack==1.2.3
