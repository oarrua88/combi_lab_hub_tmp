name: pignet2
# PIGNet2 (Moon et al., Digital Discovery 2024), inference only, CPU.
# Same RDKit as the authors (2022.03.4, Python 3.9). torch_geometric 2.0.3 is the
# authors' version: their code reads Data.keys as a property, which changed in PyG 2.4.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - numpy=1.22.4
  - pandas=1.4.3
  - scipy=1.7.3
  - scikit-learn=1.1.2
  - rdkit=2022.03.4
  - pymol-open-source=2.5.0   # pocket extraction (authors' generate_data.py)
  - openbabel=3.1.1           # authors' fallback when RDKit cannot read a pocket
  - dimorphite-dl=1.3.2       # optional ligand protonation (--protonate-ligand)
  - pip:
      # On Windows the PyPI build of torch is CPU-only. The torch_scatter / torch_sparse
      # wheels for torch 2.2 + CPU come from data.pyg.org.
      - torch==2.2.2
      - --find-links https://data.pyg.org/whl/torch-2.2.0+cpu.html
      - torch_scatter==2.1.2
      - torch_sparse==0.6.18
      - torch_geometric==2.0.3
      - hydra-core==1.2.0
      - omegaconf==2.2.2
      - biopython==1.79
      - tqdm
