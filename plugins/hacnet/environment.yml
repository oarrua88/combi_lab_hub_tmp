name: hacnet
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.15.2
  - scikit-learn=1.5.2
  - matplotlib=3.10.*
  - h5py
  - ipython
  - tqdm
  - requests
  - biopandas=0.5.1
  - openbabel=3.1.1
  - pymol-open-source=3.1.0
  # glib from conda-forge, pinned: on Windows a libglib 2.88.3 build from the Anaconda
  # 'defaults' channel overwrites intl-8.dll of libintl, and PyMOL's fontconfig then fails
  # with "No se encuentra el punto de entrada del procedimiento libintl_dgettext".
  - conda-forge::libglib=2.86.4
  - conda-forge::glib=2.86.4
  - conda-forge::libintl=0.22.5
  - pip
  - pip:
      # On Windows the PyPI build of torch is CPU-only.
      - torch==2.2.2
      - torch_geometric==2.5.3
      # Official HAC-Net package: its predict_pkd() is self-contained (no extra dependencies).
      - HACNet==1.4.3
